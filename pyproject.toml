[project]
name = "onenote-com-mcp"
version = "1.1.0"
description = "COM-only OneNote MCP server (live OneNote desktop CRUD, no Azure/Graph/token)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "mcp[cli]>=1.26.0",
    "lxml>=5.2",
    # pywin32 is the COM bridge — Windows only. Guarded import keeps Linux green.
    "pywin32>=306; sys_platform == 'win32'",
    # PDF attachment text extraction (SPEC §5, Phase 5b) — pure Python, PyInstaller-safe
    "pypdf>=5.0",
    # SVG→PNG rasterizer for insert_svg_image (the only picture-insert path). PyO3 binding to
    # the resvg Rust lib; cross-platform wheels, PyInstaller freeze validated on Windows 2026-06-14.
    "resvg-py>=0.3",
]

[project.scripts]
onenote-com-mcp = "onenote_com_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]
# Build-only (Phase 6 Stage 5 packaging). Installed on the VM via `uv sync --group packaging`;
# kept out of the normal dev/test loop. PyInstaller produces the Windows exe; the Inno Setup
# compiler (iscc.exe) is a separate, non-pip install on the build VM (see packaging/README.md).
packaging = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onenote_com_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = [
    "refs",  # reference clone — not our code
    "src/onenote_com_mcp/backend/_gen_onenote15.py",  # vendored makepy output — keep verbatim
    "packaging/spike_svg",  # throwaway freeze-gate spike (CJK literals trip E501) — not shipped
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: integration test requiring live OneNote COM on Windows (auto-skipped elsewhere)",
]
addopts = "-ra"
